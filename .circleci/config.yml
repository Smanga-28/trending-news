version: 2.1
executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.5
    working_directory: ~/project
jobs:
  build-and-deploy:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install
      - run:
          name: Build Project
          command: npm run build
      - run:
          name: Create Artifacts Directory
          command: mkdir -p ~/artifacts
      - run:
          name: Copy Build to Artifacts
          command: cp -R build/* ~/artifacts
      - store_artifacts:
          path: ~/artifacts
          destination: portfolio-build
      - run:
          name: Deploy to Hosting Service
          command: |
            # Add your deployment commands here, for example:
            # scp -r ~/artifacts user@yourserver.com:/path/to/deploy
workflows:
  version: 2
  build-and-deploy-workflow:
    jobs:
      - build-and-deploy